# Exemplo de configuração do Reldor (fica em .reldor/reldor.config.yaml no projeto do cliente)
# Tudo é opcional: sem este arquivo, o Reldor usa os valores padrão.

# language: pt-BR          # opcional: fixa o idioma; sem isso, a IA responde no idioma da conversa

modules:
  - sf

# Cadeia de ambientes, na ordem de promoção. Nomes, branches e quantidade são livres.
# Para ver e mudar sem editar à mão: reldor env  /  reldor env set "nome:branch, ..."
environments:
  - name: pre-uat
    branch: develop/x
    org: dev-sandbox        # alias do sf CLI (opcional)
  - name: uat
    branch: rc/uat
    org: uat-sandbox
  - name: producao
    branch: master
    org: production
    production: true        # qual ambiente é produção (padrão: o último)
    deploy: blocked         # o Reldor nunca faz deploy aqui

# Org usada como referência para o índice e o retrieve
reference_org: uat-sandbox
index:
  refresh_hours: 24
  depth: 2                  # quantos níveis de relacionamento seguir

# Origem da spec (detecção automática vem primeiro)
spec:
  generator: null           # ex.: comando do gerador de specs da equipe
  path: .kiro/specs

# Commit limpo e Git
git:
  base_branch: null         # de onde nascem as branches de desenvolvimento (padrão: a branch de produção)
  merge_branch: merge/{feature}-{env}      # padrão sugerido para a branch de merge
  rollback_branch: rollback/{id}
  actions: off              # off: o Reldor só confere e avisa (branch, commit, merge e PR ficam com a sua ferramenta, ex.: o plugin de fluxo do time)
                            # on: o Reldor também pode fazer o commit limpo, sempre com confirmação
  clean_commit: true
  pre_commit_hook: true
  smart_merge: suggest      # off | suggest | auto
  rerere: true

# Organizador de XML
xml:
  types: [Profile, PermissionSet, SharingRules, CustomLabels, Translations, GlobalValueSet, Layout]

# Conselheiros
advisors:
  mode: ask                 # off | ask | auto
  enabled: [spec-review, automation-design, lwc-ux]
  design_system: slds       # perguntado uma vez no init

# Revisão de segurança
security:
  sensitive_terms: [cpf, cnpj, rg, senha, password, token, saldo, cartao, agencia]
  strict_sharing: false     # true: aponta toda classe sem declaração de sharing

# Qualidade (reldor quality)
quality:
  min_tokens: 60            # tamanho mínimo de um bloco copiado
  min_lines: 6
  min_literal_files: 3      # texto em N classes vira sugestão de Custom Label

# Radar de testes
test_radar:
  auto_run: ask             # ask | always | never

# Automações e conectores (desligados por padrão)
automations: []
connectors: {}
