# Exemplo de configuração do Reldor (fica em .reldor/reldor.config.yaml no projeto do cliente).
# Tudo é opcional: sem este arquivo, o Reldor usa os valores padrão. Cada chave abaixo é lida pelo Reldor hoje.

# language: pt-BR          # opcional: fixa o idioma das respostas da IA; sem isso, ela responde no idioma da conversa

modules:
  - sf

# Cadeia de ambientes, na ordem de promoção. Nomes, branches e quantidade são livres.
# Para ver e mudar sem editar à mão: reldor env  /  reldor env set "nome:branch, ..."
environments:
  - name: pre-uat
    branch: develop/x
    org: dev-sandbox        # alias do sf CLI (opcional)
  - name: uat
    branch: rc/uat
    org: uat-sandbox
  - name: producao
    branch: master
    org: production
    production: true        # qual ambiente é produção (padrão: o último); o test-radar --run recusa rodar ali

# Org usada no retrieve e no test-radar --run quando nenhuma é informada
reference_org: uat-sandbox

index:
  refresh_hours: 24         # idade máxima do índice salvo antes de reler o projeto

# Onde ficam as specs (além de .kiro/specs, que o Reldor sempre procura)
spec:
  path: .kiro/specs

git:
  actions: off              # off: o Reldor só confere e avisa (branch, commit, merge e PR ficam com a ferramenta do time)
                            # on: o Reldor também pode fazer o commit limpo (reldor commit), sempre com confirmação
  base_branch: null         # de onde nascem as branches de desenvolvimento (padrão: a branch de produção)
  merge_branch: merge/{feature}-{env}      # nome sugerido para a branch de merge
  rollback_branch: rollback/{id}           # nome sugerido para a branch de rollback
  rerere: true              # o reldor merge install também liga o rerere do Git

# Conselheiros
advisors:
  design_system: slds       # perguntado no init e anotado no profile.md para o conselheiro de telas

# Ferramentas do time: o que outra ferramenta já faz, para o Reldor não repetir (reldor tools)
#   run    o Reldor faz (padrão)
#   verify o Reldor não faz de novo: só confere o resultado e, se não estiver certo, diz qual ferramenta rodar
#   skip   o Reldor fica de fora: não faz nem confere, e diz quem cuida
tools:
  xml-duplicates: { mode: verify, owner: "plugin do time que organiza profiles" }
  xml-order: { mode: verify, owner: "plugin do time que organiza profiles" }
  code-analyzer: { mode: skip, owner: "esteira (CI)" }

# Revisão de segurança
security:
  sensitive_terms: [cpf, cnpj, rg, senha, password, token, saldo, cartao, agencia]
  strict_sharing: false     # true: aponta toda classe sem declaração de sharing

# Qualidade (reldor quality)
quality:
  min_tokens: 60            # tamanho mínimo de um bloco copiado
  min_lines: 6
  min_literal_files: 3      # texto em N classes vira sugestão de Custom Label
  include_tests: false      # true: classes de teste também entram na busca por cópia

# Radar de testes
test_radar:
  coverage_target: 75       # cobertura mínima esperada das classes alteradas no test-radar --run
